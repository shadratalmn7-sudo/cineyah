name: Add verified known open fiction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-known-open-fiction.py'
      - '.github/workflows/add-known-open-fiction.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: known-open-fiction
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify known open fiction sources
        run: python scripts/build-known-open-fiction.py
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Static build
        run: pnpm exec next build
      - name: Publish verified titles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated-free-movies.ts content/known-open-fiction-report.json
          if git diff --cached --quiet; then
            echo "No verified catalog changes"
            exit 0
          fi
          git commit -m "feat: publish verified open fiction titles"
          git pull --rebase origin main
          git push origin HEAD:main
