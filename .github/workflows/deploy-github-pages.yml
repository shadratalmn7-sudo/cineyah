name: Deploy Cineyah to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_SITE_BASE_PATH: '/cineyah'
      NEXT_PUBLIC_SITE_ORIGIN: 'https://shadratalmn7-sudo.github.io'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Catalog and UX invariants
        run: node scripts/verify-cineyah.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build static GitHub Pages export
        run: pnpm exec next build
      - name: Verify exported production routes
        run: |
          test -f out/index.html
          test -f out/ar/index.html
          test -f out/en/index.html
          test -f out/ar/movies/pendatang-2023/index.html
          test -f out/en/movies/pendatang-2023/index.html
          grep -R -q '/cineyah/_next/' out/ar/index.html
          grep -R -q '/cineyah/ar/movies/' out/ar/index.html
          grep -R -q '/cineyah/cineyah-logo.png' out/ar/index.html
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
