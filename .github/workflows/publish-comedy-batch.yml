name: Build 100 verified comedy movies

on:
  push:
    branches:
      - chatgpt/comedy-batch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedy-100-batch
  cancel-in-progress: true

jobs:
  build-comedy-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/comedy-batch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify existing batch or repair only invalid/duplicate entries
        run: |
          set -e
          if python scripts/verify-existing-comedy.py; then
            echo "Existing 100-film batch still passes."
          else
            echo "Existing batch failed; preserving verified films and replacing only invalid or duplicate entries."
            python scripts/repair-comedy-batch.py
            python scripts/verify-existing-comedy.py
          fi
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Verify exactly 100 distinct feature films
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib
          root=pathlib.Path('.')
          spec=importlib.util.spec_from_file_location('v',root/'scripts/verify-existing-comedy.py')
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          p=json.load(open('content/generated-comedy.json'))
          assert len(p)==100
          assert len({v.norm(x['titleEn']) for x in p})==100
          assert len({v.source_key(x) for x in p})==100
          assert all('comedy' in x['genres'] for x in p)
          assert all(90 <= x['runtimeMinutes'] <= 210 for x in p)
          assert all(v.valid_title(x) if hasattr(v,'valid_title') else not any(t in x['titleEn'].lower() for t in v.BAD_TERMS) for x in p)
          r=json.load(open('content/comedy-batch-report.json'))
          assert r['verified']==r['distinct']==r['target']==100
          print('verified exactly 100 canonical-distinct playback-tested comedy feature films')
          PY
      - name: Commit verified comedy payload and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated-comedy.json content/comedy-batch-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: refresh verified 100 comedy feature batch"
          git push origin HEAD:chatgpt/comedy-batch
