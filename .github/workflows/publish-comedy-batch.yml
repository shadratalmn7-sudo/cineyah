name: Build 100 verified comedy movies

on:
  push:
    branches:
      - chatgpt/comedy-batch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedy-100-batch
  cancel-in-progress: true

jobs:
  build-comedy-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/comedy-batch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Revalidate existing comedy batch
        id: revalidate
        continue-on-error: true
        run: python scripts/verify-existing-comedy.py
      - name: Rebuild exact batch when any source is stale
        if: steps.revalidate.outcome != 'success'
        run: python scripts/build-comedy-catalog.py
      - name: Revalidate exactly 100 browser-playable comedy features
        run: python scripts/verify-existing-comedy.py
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Verify exactly 100 distinct features
        run: |
          python - <<'PY'
          import json,re
          p=json.load(open('content/generated-comedy.json'))
          norm=lambda s: re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()
          assert len(p)==100
          assert len({norm(x['titleEn']) for x in p})==100
          assert all('comedy' in x['genres'] for x in p)
          assert all(90 <= x['runtimeMinutes'] <= 210 for x in p)
          assert all(x['sources'] and x['sources'][0]['url'].startswith('https://') for x in p)
          r=json.load(open('content/comedy-batch-report.json'))
          assert r['verified']==r['distinct']==r['target']==100
          print('verified exactly 100 distinct playback-tested comedy feature films')
          PY
      - name: Commit verified comedy payload and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated-comedy.json content/comedy-batch-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: refresh verified 100 comedy feature batch"
          git push origin HEAD:chatgpt/comedy-batch
