name: Review Ulises playback candidates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-ulises.yml'
      - 'scripts/repair-ulises.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Inspect legal Internet Archive candidates without publishing
        run: python scripts/repair-ulises.py
      - name: Assert public catalog still disables Ulises playback
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('lib/catalog.ts').read_text(encoding='utf-8')
          start = text.index('id:"ulises-2012"')
          end = text.index('// Horror batch', start)
          block = text[start:end]
          assert 'sources:[]' in block, 'Ulises must remain non-playable until Safari/iPhone playback is verified'
          print('Ulises public playback remains disabled.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ulises-playback-review
          path: content/ulises-playback-review.json
          if-no-files-found: error
