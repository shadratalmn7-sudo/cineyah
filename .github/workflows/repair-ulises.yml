name: Repair Ulises playback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ulises.yml'
      - 'scripts/repair-ulises.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ffmpeg tools
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Range, decode and extract real movie backdrop
        run: python scripts/repair-ulises.py
      - name: Install app dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit verified source and backdrop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/catalog.ts content/ulises-playback-verified.json public/backdrops/ulises-2012.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix: use verified Ulises playback and real movie backdrop"
          git pull --rebase origin main
          git push origin main
