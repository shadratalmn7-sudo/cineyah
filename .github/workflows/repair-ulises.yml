name: Repair Ulises playback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ulises.yml'
      - 'scripts/repair-ulises.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Probe and repair Ulises source
        run: python scripts/repair-ulises.py
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/catalog.ts content/ulises-playback-verified.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: use playback-verified Ulises rendition"
          git pull --rebase origin main
          git push origin main
