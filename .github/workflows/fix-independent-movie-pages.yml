name: Fix movie preview flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-independent-movie-pages.yml'
      - 'scripts/fix-independent-movie-pages.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cineyah-preview-flow
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply brief-preview and scroll-lock fix
        run: python scripts/fix-independent-movie-pages.py
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit verified preview flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/cineyah-app.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: brief movie preview with locked background"
          git pull --rebase origin main
          git push origin main
