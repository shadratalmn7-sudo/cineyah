name: Fix independent movie pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-independent-movie-pages.yml'
      - 'scripts/fix-independent-movie-pages.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dedicated-page and backdrop patch
        run: python scripts/fix-independent-movie-pages.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/cineyah-app.tsx app/globals.css lib/catalog.ts scripts/repair-ulises.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: route every movie into its own cinematic page"
          git pull --rebase origin main
          git push origin main
