name: Verify standalone movie pages

on:
  push:
    branches: [chatgpt/fix-movie-pages]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/backdrops/**'
      - '.github/workflows/verify-movie-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Production build
        run: corepack pnpm build
